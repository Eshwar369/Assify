name: Principles Verification

on:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Install speckit-cli
        run: pip install speckit-cli
      - name: Run speckit verification
        run: speckit-verify --principles .specify/memory/constitution.md
